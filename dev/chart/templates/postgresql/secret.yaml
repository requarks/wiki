{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "wiki.postgresql.fullname" . }}
{{- $keys := .Values.postgresql.auth.secretKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wiki.postgresql.labels" . | nindent 4 }}
  annotations:
    # Deleting this with the release would lose the only record of a generated password, for a
    # database whose claim outlives the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $keys.userPasswordKey }}: {{ include "wiki.secretValue" (list . $name $keys.userPasswordKey .Values.postgresql.auth.password) | quote }}
  {{ $keys.adminPasswordKey }}: {{ include "wiki.secretValue" (list . $name $keys.adminPasswordKey .Values.postgresql.auth.postgresPassword) | quote }}
{{- end }}
