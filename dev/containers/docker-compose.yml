# -- DEV DOCKER-COMPOSE --
# -- DO NOT USE IN PRODUCTION! --
#
# UI / source development stack. Uses the Postgres DB from dev/examples
# (examples-db-1). Start that DB first:
#   cd dev/examples && docker compose up -d db

version: "3"
services:
  adminer:
    container_name: wiki-adminer
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    logging:
      driver: "none"
    ports:
      - "3001:8080"
    networks:
      - examples-db

  wiki:
    container_name: wiki-app
    build:
      context: ../..
      dockerfile: dev/containers/Dockerfile
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
    ports:
      - "3000:3000"
    volumes:
      - ../..:/wiki
      - /wiki/node_modules
      - /wiki/.git
    networks:
      - examples-db

networks:
  examples-db:
    external: true
    name: examples_default
