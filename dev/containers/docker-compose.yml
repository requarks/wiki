# -- DEV DOCKER-COMPOSE --
# -- DO NOT USE IN PRODUCTION! --
#
# Production stack + deploy scripts: dev/deploy/
#   docker-compose.yml, deploy-wiki.sh, rollback-wiki.sh
#
# UI / source development stack. Uses the Postgres DB from dev/examples
# (examples-db-1). Start that DB first:
#   cd dev/examples && docker compose up -d db

version: "3"
services:
  adminer:
    container_name: wiki-adminer
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    logging:
      driver: "none"
    ports:
      - "3001:8080"
    networks:
      - examples-db

  # solr:
  #   container_name: wiki-solr
  #   image: solr:7-alpine
  #   logging:
  #     driver: "none"
  #   ports:
  #     - "8983:8983"
  #   volumes:
  #     - solr-data:/opt/solr/server/solr/mycores
  #   entrypoint:
  #     - docker-entrypoint.sh
  #     - solr-precreate
  #     - wiki

  wiki:
    container_name: wiki-app
    build:
      context: ../..
      dockerfile: dev/containers/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../..:/wiki
      - /wiki/node_modules
      - /wiki/.git
    networks:
      - examples-db

networks:
  examples-db:
    external: true
    name: examples_default
