mutation($theme: String!, $iconset: String!, $darkMode: Boolean!, $tocPosition: String, $injectCSS: String, $injectHead: String, $injectBody: String, $customFonts: [CustomFontInput]) {
  theming {
    setConfig(theme: $theme, iconset: $iconset, darkMode: $darkMode, tocPosition: $tocPosition, injectCSS: $injectCSS, injectHead: $injectHead, injectBody: $injectBody, customFonts: $customFonts) {
      responseResult {
        succeeded
        errorCode
        slug
        message
      }
    }
  }
}
