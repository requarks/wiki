key: google
title: Google
description: Sign in with a Google account or a Google Workspace domain.
author: requarks.io
logo: https://static.requarks.io/logo/google.svg
icon: /_assets/icons/ultraviolet-google.svg
color: red-6
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the OAuth 2.0 Client ID created in the Google Cloud console.
    icon: key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same OAuth 2.0 Client ID.
    icon: password
    sensitive: true
    order: 2
  hostedDomain:
    type: String
    title: Restrict to Workspace Domain
    hint: (optional) A Workspace domain, e.g. example.com. Only accounts on it may sign in — checked here as well as asked for, since the parameter alone is a hint to Google rather than a guarantee.
    icon: geography
    order: 3
  allowUnverifiedEmail:
    type: Boolean
    title: Accept Unverified Addresses
    hint: Off by default. A Google account whose address is unverified proves nothing about the mailbox, and an account here is matched on the address.
    icon: received
    default: false
    order: 4
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Put the user in the wiki groups their Google Workspace groups name, on every login. Only groups that already exist here are matched — nothing is created. Workspace only, and it needs the Cloud Identity API enabled on the Google Cloud project this OAuth client belongs to.
    icon: user-groups
    default: false
    order: 5
  groupIdentifier:
    type: String
    title: Match Groups By
    hint: Which of the two things a Workspace group has is matched against the names of the groups here — the address, engineering@example.com, or the display name, Engineering. The address is unique and survives a rename; the display name reads better, but two groups may share one and then both match.
    icon: rules
    enum:
      - email|Group address
      - name|Display name
    default: email
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
  unassignMissingGroups:
    type: Boolean
    title: Unassign from groups no longer present in Workspace
    hint: Off adds what Workspace names and takes nothing away, so a membership granted here survives. On makes Workspace the authority instead, and a group somebody is removed from there is taken away here — bar the groups this strategy auto-enrolls into, which are granted here to everyone it lets in.
    icon: unfriend
    default: false
    order: 7
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: Authorized Redirect URI
    hint: Add this to the OAuth client's authorized redirect URIs in the Google Cloud console.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
