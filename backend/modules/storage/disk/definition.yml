key: disk
title: Local File System
icon: '/_assets/icons/ultraviolet-hdd.svg'
banner: '/_assets/storage/disk.jpg'
description: Store files on the local file system or over network attached storage. Note that you must use replicated storage if using high-availability instances.
assetDelivery:
  isDirectAccessSupported: false
contentTypes:
  defaultTypesEnabled: ['pages', 'images', 'documents', 'others', 'large']
props:
  path:
    type: String
    title: Path
    hint: Where this site's folder tree is written, directly into the path given with no folder for the site inside it - so give each site its own path. Relative paths are resolved from the Wiki.js install directory (e.g. ./data/content, /home/wiki/content, C:\wiki\content)
    icon: symlink-directory
    order: 1
    default: ./data/content
actions:
  exportAll:
    label: Export Everything
    hint: Write a copy of every page and asset this target is configured to hold to the file system, overwriting whatever is already there. Nothing in the database is changed and nothing is moved.
    icon: downloads
  importAll:
    label: Import Everything
    hint: Take every page and asset in the folder that the wiki does not have yet into the wiki. A file is imported as a page if its extension is one of the site's Page Extensions, or if it declares an editor in its front matter (or, for JSON, an editor property); everything else is imported as an asset. Anything already at the same path is left alone on both sides, so this is safe to run again and will not pick up a file that was edited on disk.
    icon: database-restore
  importAllOverwrite:
    label: Import Everything and Overwrite
    hint: Take every page and asset in the folder, overwriting existing entries. A file is imported as a page if its extension is one of the site's Page Extensions, or if it declares an editor in its front matter (or, for JSON, an editor property); everything else is imported as an asset.
    warn: This replaces what the wiki currently has wherever a file in the folder lands on it. An overwritten page keeps its previous version in its history, but a file has none - the bytes it replaces are gone from every storage target holding them.
    icon: database-daily-import
