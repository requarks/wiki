key: page_navigation
title: Page Navigation
description: 'Arrow-box prev/next navigation and সূচী index for tagged page series.'
author: sunninoor.com
logo: https://static.requarks.io/logo/wikijs-butterfly.svg
website: https://wiki.js.org
isAvailable: true
props:
  pageGroupTagRegex:
    type: String
    title: Page group tag regex
    default: '^from:.+|^download$|^up:কিতাব$'
    hint: 'Use | for alternates. ^from:… matches alone (series pages). All other alternates must match together (e.g. ^download$ and ^up:কিতাব$ with ^…$ for exact tags).'
    order: 1
  disableNavTag:
    type: String
    title: Disable navigation tag
    default: 'nav:off'
    hint: 'Pages with this exact tag never show page navigation arrows.'
    order: 2
  indexLabel:
    type: String
    title: Index button label (সূচী)
    default: 'সূচী'
    order: 3
