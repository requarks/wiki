# ===============================================
# PAGE NAVIGATION
# ===============================================

extend type Query {
  pageNavigation: PageNavigationQuery
}

extend type Mutation {
  pageNavigation: PageNavigationMutation
}

# -----------------------------------------------
# QUERIES
# -----------------------------------------------

type PageNavigationQuery {
  providers: [PageNavigationProvider] @auth(requires: ["manage:system"])
}

# -----------------------------------------------
# MUTATIONS
# -----------------------------------------------

type PageNavigationMutation {
  updateProviders(
    providers: [PageNavigationProviderInput]!
  ): DefaultResponse @auth(requires: ["manage:system"])
}

# -----------------------------------------------
# TYPES
# -----------------------------------------------

type PageNavigationProvider {
  isEnabled: Boolean!
  key: String!
  props: [String]
  title: String!
  description: String
  isAvailable: Boolean
  logo: String
  website: String
  config: [KeyValuePair]
}

input PageNavigationProviderInput {
  isEnabled: Boolean!
  key: String!
  config: [KeyValuePairInput]
}
