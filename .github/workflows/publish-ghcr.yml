name: Publish to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.5.315-alpha-1.0.0 or v2.5.315)'
        required: true
        type: string
      tag_latest:
        description: 'Also push the latest tag'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/kayesh/wiki

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Version cannot be empty." >&2
            exit 1
          fi
          echo "REL_VERSION_STRICT=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION"

      - name: Set package version
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          mv package.json pkg-temp.json
          jq --arg vs "$REL_VERSION_STRICT" -r '. + {dev:false, version:$vs}' pkg-temp.json > package.json
          rm pkg-temp.json
          cat package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.REL_VERSION_STRICT }}
          labels: |
            org.opencontainers.image.source=https://github.com/kayesh/wiki
            org.opencontainers.image.version=${{ env.REL_VERSION_STRICT }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Tag latest
        if: inputs.tag_latest
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${{ env.REL_VERSION_STRICT }}"

      - name: Summary
        run: |
          {
            echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "docker pull ${{ env.IMAGE }}:${{ env.REL_VERSION_STRICT }}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ inputs.tag_latest }}" = "true" ]; then
              echo "docker pull ${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          }
